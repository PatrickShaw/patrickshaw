# Replaces the old wofi config + styles.css.
# Fuzzel is a native Wayland launcher (no GTK), so styling is this one ini file
# rather than config + CSS. See `man 5 fuzzel.ini`.

font=JetBrains Mono:size=11
dpi-aware=no
layer=overlay
prompt="❯ "
icon-theme=Papirus
# Matches wofi's `--matching multi-contains`
match-mode=fuzzy
lines=15
width=50
horizontal-pad=24
vertical-pad=12
inner-pad=12
# wofi's single_click=true equivalent
# (fuzzel selects on single click by default)

[colors]
# rgba(31, 31, 31, 0.95) from the old wofi #window rule
background=1f1f1ff2
text=ffffffff
prompt=ffffffff
placeholder=ffffff80
input=ffffffff
match=8ab4f8ff
selection=ffffff1a
selection-text=ffffffff
selection-match=8ab4f8ff
border=8ab4f8ff

[border]
width=1
# Matches the old 20px border-radius
radius=20

[dmenu]
# Used by the cliphist binding in hypr/hyprland.conf
exit-immediately-if-empty=yes
