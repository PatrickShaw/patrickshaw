<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Learning quiz</title>
  <link rel="stylesheet" href="survey-core.min.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="survey.core.min.js"></script>
  <script defer src="survey-js-ui.min.js"></script>
  <script defer src="choice-feedback.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header><span class="eyebrow">A LITTLE PRACTICE</span><span class="privacy">Local quiz · no account needed</span></header>
  <main>
    <p class="intro">This is practice, not an exam. Check each answer for an explanation, or skip and learn something new.</p>
    <p id="status" role="status">Loading your quiz…</p>
    <div id="survey"></div>
    <section id="answer-feedback" hidden aria-label="Answer explanation" tabindex="-1"></section>
    <div id="controls" hidden>
      <button id="check" type="button">Check answer</button>
      <button id="skip" type="button" class="secondary">Skip and explain</button>
      <button id="next" type="button" hidden>Next question</button>
    </div>
    <section id="results" hidden aria-label="Quiz results" tabindex="-1"></section>
    <button id="retry" type="button" hidden>Retry saving answers</button>
    <button id="download" type="button" hidden>Download answers as a backup</button>
  </main>
  <footer>Answers stay on this computer. Your agent can read saved results to plan your next quiz.</footer>
</body>
</html>
