# One-off after switching: `atuin import auto` to pull in existing shell history.
# The shells init atuin with `--disable-up-arrow`, so Ctrl-R opens atuin and Up
# stays as plain shell history.

## Local only — no account, no server round trips.
auto_sync = false
# Nix: Nope
update_check = false

## Fuzzy matching, same as MCFLY_FUZZY=2.
search_mode = "fuzzy"

## Search all history by default rather than scoping to the current dir/session.
filter_mode = "global"

filters = [
  "global",
  "directory",
  # I think you can get this just by using session for the most part
  # "preload-session"
]

# Best if you use in big and small terminals
style = "auto"
# May as well sshow lots of history
inline_height = 30

# Commands top to bottom in recency. Search at top
invert = true

# Kind of use it for it's most intuitive functionality so no need for help
show_help = false
show_tabs = false

## Enter runs the selected command immediately; false puts it on the prompt
## first so it can be edited. Matches mcfly's behaviour.
enter_accept = false

## Commands never worth recording.
history_filter = [
  "^ ",
  "git add .",
  "git push -f",
  "cd ..",
  "cd ../"
]
